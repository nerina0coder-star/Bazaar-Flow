{% extends 'base.html' %}

{% block title %} ویرایش جزئیات {% endblock %}

{% block content %}

<div class="edit-chamber-container">
    <h2 class="mb-4"> ویرایش تالار {{ custom_message }}</h2>
    <form method="POST" action="/chamber/edit/{{ chamber.id }}">
        <!-- Chamber Name -->
        <div class="mb-3">
            <label class="form-label" for="name"> >نام تالار</label>
            <input type="text" class="form-control form-control-lg" id="name" name="name" value="{{ chamber.name }}" required>
        </div>

        <!-- Entrance Code -->
        <div class="mb-4">
            <label class="form-label" for="entrance_code">کد ورود</label>
            <input type="text" class="form-control form-control-lg" id="entrance_code" name="entrance_code" value="{{ chamber.entrance_code }}" required>
            <div class="form-text">حداقل ۴ کاراکتر</div>
        </div>

        <!-- Description -->
        <div class="mb-4">
            <label for="description" class="form-label"></label>
            <textarea name="description" id="description" rows="2" class="form-control">{{ chamber.description }}</textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-lg px-4 rounded-pill">ذخیره تغییرات</button>
            <a href="/chamber/chambers/{{ chamber.id }}/members" class="btn btn-outline-primary btn-lg rounded-pill">تغییر اعضا</a>
            <a class="btn btn-outline-secondary btn-lg px-4 rounded-pill" href="/chamber/dashboard">انصراف</a>
        </div>
    </form>
</div>

{% endblock %}

{% block style %}

<style>
.edit-chamber-container {
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1rem;
}
.form-control:focus {
    box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.25);
}
</style>

{% endblock %}
