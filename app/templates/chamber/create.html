{% extends 'base.html' %}

{% block title %} ساخت تالار {% endblock %}

{% block content %}

<div class="create-chamber-container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h4 mb-0"> ایجاد تالار جدید {{custom_message}}</h2>
                        <a href="/chamber/dashboard" class="btn btn-outline-secondary rounded-pill">
                            <i class="bi bi-arrow-right me-1"></i> بازگشت
                        </a>
                    </div>

                    <form method="POST" action="/chamber/create">
                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">نام تالار <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required autofocus>
                            <div class="form-text">مثال: «تالار رفع اشکال جاوااسکریپت»</div>
                        </div>

                        <!-- Entrance code -->
                        <div class="mb-3">
                            <label for="entrance_code" class="form-label">کد ورود <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="entrance_code" name="entrance_code" required>
                            <div class="form-text">حداقل ۴ کاراکتر. مثال: `JS2025`</div>
                        </div>

                        <!-- Description -->

                        <div class="mb-4">
                            <label for="description" class="form-label">توضیحات</label>
                            <textarea class="form-control" id="description" name="description" rows="2" required></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary rounded-pill py-2">
                                <i class="bi bi-plus-circle me-1"></i> ایجاد تالار
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block style %}

<style>
.create-chamber-container {
    max-width: 800px;
    margin: 2rem auto;
    padding: 0 1rem;
}
.card {
    background-color: #ffffff;
}
.form-text {
    font-size: 0.75rem;
    color: #6c757d;
}
</style>

{% endblock %}
