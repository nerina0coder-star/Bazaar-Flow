{% extends 'base.html' %}

{% block title %} ورود {% endblock %}

{% block content %}

<!-- Login Page: Only <main> tag for Bootstrap login form -->
<main class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow border-0" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4 p-md-5">
      <h2 class="card-title text-center mb-4 fw-bold">
          خوش آمدی!
      {{ customMessage }}</h2>
      <form action="/auth/login" method="post">
        <div class="mb-3">
          <label for="username" class="form-label"></label>
          <input type="text" class="form-control" id="username" name="username">
        </div>
        <div class="mb-3">
          <label for="loginEmail" class="form-label">آدرس ایمیل</label>
          <input type="email" class="form-control" id="loginEmail" name="email" placeholder="name@example.com" required autofocus>
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">رمزعبور</label>
          <input type="password" class="form-control" id="loginPassword" name="password" required>
        </div>
        <div class="mb-3 d-flex justify-content-between align-items-center">
          <a href="#" class="text-decoration-none small">رمزتو فراموش کردی؟</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">ورود</button>
        <div class="text-center mt-4">
          <span class="text-muted">جدید اومدی؟</span>
          <a href="/auth/register" class="text-decoration-none ms-1 fw-semibold">ثبت‌نام کن!</a>
        </div>
      </form>
    </div>
  </div>
</main>

{% endblock %}
