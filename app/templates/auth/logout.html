<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-box-arrow-right text-danger" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
                        <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
                    </svg>
                </div>
                <h3 class="h4 mb-3">خروج از حساب</h3>
                <p class="text-muted mb-4">آیا مطمئن هستید که می‌خواهید خارج شوید؟</p>
                <form method="POST" action="{{ url_for('auth.logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    {% if CsrfError %}
                        <p class="alert alert-danger alert-dismissable fade show" role="alert">
                            به مدت طولانی افلاین بودید٬ لطفا دوباره تلاش کنید
                        </p>
                    {% endif %}
                    <button type="submit" class="btn btn-danger btn-lg w-100 rounded-pill">بله، خارج شوم</button>
                    <a href="{{ url_for('profile.memory') }}" class="btn btn-outline-secondary btn-lg w-100 rounded-pill mt-3">نه، بازگشت</a>
                </form>
            </div>
        </div>
    </div>
</div>
